<!-- Primary Underlined Tabs -->
<div class="cs-tabs" role="tablist">
  <button type="button" class="cs-tabs__tab cs-tabs__tab--selected" role="tab" aria-selected="true">
    <span class="cs-tabs__tab-label">Profile</span>
  </button>
  <button type="button" class="cs-tabs__tab" role="tab" aria-selected="false">
    <span class="cs-tabs__tab-label">Schedule</span>
  </button>
  <button type="button" class="cs-tabs__tab" role="tab" aria-selected="false">
    <span class="cs-tabs__tab-label">Documents</span>
  </button>
  <div class="cs-tabs__filler"></div>
</div>

<!-- Secondary Segmented Tabs -->
<div class="cs-segtab">
  <button type="button" class="cs-segtab__item cs-segtab__item--active">Day</button>
  <button type="button" class="cs-segtab__item">Week</button>
  <button type="button" class="cs-segtab__item">Month</button>
</div>
