<!-- Primary Underlined Tabs -->
<nav class="cs-tabs" aria-label="Page Sections" data-component="primary-tab">
  <button type="button" class="cs-tab cs-tab--active" aria-selected="true" role="tab">
    <svg class="cs-tab__icon" aria-hidden="true"><use href="/assets/icons/sprite.svg#person"></use></svg>
    <span class="cs-tab__label">Profile</span>
  </button>
  <button type="button" class="cs-tab" aria-selected="false" role="tab">
    <svg class="cs-tab__icon" aria-hidden="true"><use href="/assets/icons/sprite.svg#calendar_today"></use></svg>
    <span class="cs-tab__label">Schedule</span>
  </button>
  <button type="button" class="cs-tab" aria-selected="false" role="tab">
    <svg class="cs-tab__icon" aria-hidden="true"><use href="/assets/icons/sprite.svg#description"></use></svg>
    <span class="cs-tab__label">Documents</span>
  </button>
</nav>

<!-- Secondary Segmented / Pill Tabs -->
<div class="cs-tabs cs-tabs--secondary" data-component="secondary-tab">
  <button type="button" class="cs-tab-pill cs-tab-pill--active" aria-pressed="true">
    Day
  </button>
  <button type="button" class="cs-tab-pill" aria-pressed="false">
    Week
  </button>
  <button type="button" class="cs-tab-pill" aria-pressed="false">
    Month
  </button>
</div>
