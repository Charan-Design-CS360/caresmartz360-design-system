<table class="cs-table">
  <thead>
    <tr>
      <th class="cs-table__cell">Name</th>
      <th class="cs-table__cell">Status</th>
      <th class="cs-table__cell">Actions</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td class="cs-table__cell cs-table__cell--link">John Doe</td>

    </tr>
