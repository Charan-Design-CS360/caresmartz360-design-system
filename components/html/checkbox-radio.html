<!-- Custom Checkbox -->
<label class="cs-checkbox-label">
  <input type="checkbox" class="cs-checkbox" />
  <span class="cs-checkbox-text">Option Label</span>
</label>

<!-- Custom Radio -->
<label class="cs-radio-label">
  <input type="radio" name="demo-radio" class="cs-radio" checked />
  <span class="cs-radio-text">Default Option</span>
</label>

<label class="cs-radio-label">
  <input type="radio" name="demo-radio" class="cs-radio" />
  <span class="cs-radio-text">Secondary Option</span>
</label>
