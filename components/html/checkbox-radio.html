<!-- Custom Checkbox Row -->
<div class="cs-control-row">
  <input type="checkbox" class="cs-checkbox" id="chk-demo" />
  <label class="cs-control-row__label" for="chk-demo">Option Label</label>
</div>

<!-- Custom Radio Row -->
<div class="cs-control-row">
  <input type="radio" name="demo-radio" class="cs-radio" id="rad-1" checked />
  <label class="cs-control-row__label" for="rad-1">Primary Option</label>
</div>

<!-- Switch Toggle -->
<div class="cs-toggle">
  <input type="checkbox" class="cs-toggle__input" id="tog-demo" />
  <label class="cs-toggle__track" for="tog-demo">
    <span class="cs-toggle__dot"></span>
  </label>
</div>
