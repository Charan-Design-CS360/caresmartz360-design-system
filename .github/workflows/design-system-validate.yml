name: Validate Design System

on:
  pull_request:
    paths:
      - ".github/workflows/design-system-validate.yml"
      - "package.json"
      - "config/**"
      - "docs/LAYER-4-PATTERN-TEMPLATE-CONTRACT.md"
      - "portals/**"
      - "schemas/**"
      - "components/**"
      - "scripts/**"
      - "shared/**"
      - "snapshots/**"
      - "tests/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/design-system-validate.yml"
      - "package.json"
      - "config/**"
      - "docs/LAYER-4-PATTERN-TEMPLATE-CONTRACT.md"
      - "portals/**"
      - "schemas/**"
      - "components/**"
      - "scripts/**"
      - "shared/**"
      - "snapshots/**"
      - "tests/**"

permissions:
  contents: read

concurrency:
  group: design-system-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portal-contract:
    name: Portal manifest and isolation contract
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate (strict) — gates fail on real errors, not NOTICEs
        # ci:check = release:check minus DS_REQUIRE_FRESH_SNAPSHOTS: no attested
        # snapshot exists yet for any portal (pending Figma-AI's first one), so
        # requiring freshness would block every PR on a mechanism that has never
        # run. Flip to release:check once snapshots exist.
        run: npm run ci:check
